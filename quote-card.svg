<svg width="700" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#34D399;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.1" />
    </linearGradient>
    
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#34D399;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.4" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect x="10" y="10" width="680" height="140" rx="24" ry="24" 
        fill="none" stroke="#10B981" stroke-width="2" 
        opacity="0.3" filter="url(#glow)"/>
  
  <rect x="15" y="15" width="670" height="130" rx="20" ry="20" 
        fill="url(#glassBg)" stroke="url(#glassBorder)" 
        stroke-width="1.5" filter="url(#shadow)"/>
  
  <rect x="20" y="20" width="660" height="60" rx="16" ry="16" 
        fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  
  <text x="45" y="75" font-family="Georgia, serif" font-size="60" 
        fill="#10B981" opacity="0.5">"</text>
  
  <text x="350" y="75" text-anchor="middle" 
        font-family="Poppins, -apple-system, sans-serif" 
        font-size="18" fill="#FFFFFF" font-weight="500" font-style="italic">
    Code is like humor. When you have to explain it, it's bad.
  </text>
  
  <text x="350" y="115" text-anchor="middle" 
        font-family="Poppins, sans-serif" font-size="13" 
        fill="#10B981" font-weight="600" letter-spacing="1">
    — CORY HOUSE —
  </text>
  
  <line x1="280" y1="130" x2="420" y2="130" 
        stroke="#10B981" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
</svg>
